<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Watermark Generator (Perfect Align Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #2979ff; --text: #f5f5f5; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; flex-direction: row; gap: 20px; width: 100%; max-width: 1300px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
        .control-panel { background: var(--panel); padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .canvas-wrapper { flex: 1; min-width: 300px; max-width: 900px; display: flex; flex-direction: column; align-items: center; position: relative; }
        canvas { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: grab; touch-action: none; }
        canvas:active { cursor: grabbing; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #aaa; text-transform: uppercase; }
        input[type="text"], input[type="file"], select { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: var(--accent); }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        .slider-label { display: flex; justify-content: space-between; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background: #1c54b2; }
        .hint { color: #4caf50; font-size: 13px; margin-top: -10px; margin-bottom: 15px; font-style: italic; }
        #status { color: #ffeb3b; font-size: 13px; margin-bottom: 15px; font-weight: 600; text-align: center; line-height: 1.4;}
        .section-title { margin: 0 0 15px 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bảng Điều Khiển -->
        <div class="control-panel">
            <h2 class="section-title">Nạp Ảnh & Thông Số</h2>
            
            <div class="form-group">
                <input type="file" id="imageInput" accept="image/jpeg, image/png, image/heic, image/heif, .heic, .heif">
            </div>
            <div id="status">Chờ nạp ảnh...</div>

            <div class="form-group">
                <label>Hãng (Gõ Samsung, Xiaomi, Leica, Huawei...)</label>
                <input type="text" id="inMake" placeholder="VD: SAMSUNG">
            </div>
            <div class="form-group">
                <label>Tên Thiết Bị</label>
                <input type="text" id="inModel" placeholder="VD: GALAXY S24 ULTRA">
            </div>
            <div class="form-group">
                <label>Thông số EXIF</label>
                <input type="text" id="inSpecs" placeholder="VD: 23mm f/1.7 1/1350 ISO12">
            </div>
            <div class="form-group">
                <label>Địa điểm & Thời gian</label>
                <input type="text" id="inLocation" placeholder="VD: Phường, Quận, Thành phố | Ngày">
            </div>

            <h2 class="section-title" style="margin-top: 25px;">Tùy Chỉnh Giao Diện</h2>
            <div class="hint">💡 Mẹo: Nhấn và kéo thả trực tiếp từng dòng chữ trên ảnh để tùy biến vị trí!</div>
            
            <div class="form-group">
                <label>Bố cục Gốc (Layout)</label>
                <select id="inLayout">
                    <option value="center">Căn Giữa (Nằm dưới đáy)</option>
                    <option value="split">Chia Trái - Phải</option>
                </select>
                <button id="btnResetDrag" class="btn" style="background:#555; margin-top:10px; font-size: 14px; padding: 8px;">↺ Reset Vị Trí Kéo Thả</button>
            </div>
            <div class="form-group">
                <label>Màu Logo & Chữ</label>
                <select id="inColor">
                    <option value="original">Màu Hãng (Xanh Samsung, Đỏ Leica...)</option>
                    <option value="white">Trắng (White)</option>
                    <option value="black">Đen (Black)</option>
                </select>
            </div>
            <div class="form-group">
                <div class="slider-label"><label>Độ Mờ Nền (Blur)</label><span id="valBlur">16</span></div>
                <input type="range" id="slBlur" min="0" max="100" value="16">
            </div>
            <div class="form-group">
                <div class="slider-label"><label>Độ Dày Viền Chung (%)</label><span id="valPadding">6</span></div>
                <input type="range" id="slPadding" min="2" max="25" value="6">
            </div>
            <div class="form-group">
                <div class="slider-label"><label>Độ Dày Lề Dưới (%)</label><span id="valBottom">12</span></div>
                <input type="range" id="slBottom" min="2" max="30" value="12">
            </div>
            <div class="form-group">
                <div class="slider-label"><label>Kích Thước Chữ (Scale)</label><span id="valScale">185</span></div>
                <input type="range" id="slScale" min="50" max="300" value="185">
            </div>
            
            <hr style="border-color: #333; margin: 20px 0;">
            
            <div class="form-group">
                <div class="slider-label"><label style="color:#2979ff;">Căn chỉnh Logo (Lên/Xuống)</label><span id="valLogoY">0</span></div>
                <input type="range" id="slLogoY" min="-100" max="100" value="0">
            </div>
            <div class="form-group">
                <div class="slider-label"><label>Master Offset (Toàn bộ Cụm)</label><span id="valOffsetY">0</span></div>
                <input type="range" id="slOffsetY" min="-200" max="200" value="0">
            </div>

            <button class="btn" id="downloadBtn" style="display:none; background: #4caf50;">Tải Ảnh Về</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="outCanvas"></canvas>
        </div>
    </div>

    <script>
        let currentImage = null;
        let currentCacheKey = "";
        const loadedImages = {}; 

        let dragOffsets = { brand: {x: 0, y: 0}, specs: {x: 0, y: 0}, loc: {x: 0, y: 0} };
        let hitBoxes = { brand: {x: 0, y: 0, w: 0, h: 0}, specs: {x: 0, y: 0, w: 0, h: 0}, loc: {x: 0, y: 0, w: 0, h: 0} };
        let activeDrag = null;
        let startMouseX = 0, startMouseY = 0;

        const BRAND_MAP = {
            'SAMSUNG': { slug: 'samsung', color: '#1428A0', type: 'wordmark', scale: 4.5, yOffset: 0 },
            'APPLE': { slug: 'apple', color: '#000000', type: 'icon', scale: 1.3, yOffset: -0.05 },
            'XIAOMI': { slug: 'xiaomi', color: '#FF6900', type: 'icon', scale: 1.5, yOffset: 0 },
            'SONY': { slug: 'sony', color: '#000000', type: 'wordmark', scale: 4.5, yOffset: 0 },
            'OPPO': { slug: 'oppo', color: '#006633', type: 'wordmark', scale: 3.5, yOffset: 0 },
            'VIVO': { slug: 'vivo', color: '#415FFF', type: 'wordmark', scale: 3.5, yOffset: 0 },
            'HUAWEI': { slug: 'huawei', color: '#FF0000', type: 'icon', scale: 1.6, yOffset: 0 },
            'ONEPLUS': { slug: 'oneplus', color: '#F5010C', type: 'icon', scale: 1.5, yOffset: 0 },
            'GOOGLE': { slug: 'google', color: '#4285F4', type: 'icon', scale: 1.5, yOffset: 0 },
            'ASUS': { slug: 'asus', color: '#00539B', type: 'wordmark', scale: 4, yOffset: 0 },
            'REALME': { slug: 'realme', color: '#FFD600', type: 'wordmark', scale: 4, yOffset: 0 },
            'MOTOROLA': { slug: 'motorola', color: '#001428', type: 'icon', scale: 1.5, yOffset: 0 },
            'NOKIA': { slug: 'nokia', color: '#124191', type: 'wordmark', scale: 4.5, yOffset: 0 },
            'CANON': { slug: 'canon', color: '#CC0000', type: 'wordmark', scale: 4.5, yOffset: 0 },
            'NIKON': { slug: 'nikon', color: '#FFE600', type: 'wordmark', scale: 4.5, yOffset: 0 },
            'FUJIFILM': { slug: 'fujifilm', color: '#EE0000', type: 'wordmark', scale: 4.5, yOffset: 0 },
            'LEICA': { slug: 'leica', color: '#ED1C24', type: 'icon', scale: 1.8, yOffset: 0 }
        };

        ['inMake', 'inModel', 'inSpecs', 'inLocation', 'inColor', 'slBlur', 'slPadding', 'slBottom', 'slScale', 'slOffsetY', 'slLogoY'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                if(e.target.id === 'slBlur') document.getElementById('valBlur').innerText = e.target.value;
                if(e.target.id === 'slPadding') document.getElementById('valPadding').innerText = e.target.value;
                if(e.target.id === 'slBottom') document.getElementById('valBottom').innerText = e.target.value;
                if(e.target.id === 'slScale') document.getElementById('valScale').innerText = e.target.value;
                if(e.target.id === 'slOffsetY') document.getElementById('valOffsetY').innerText = e.target.value;
                if(e.target.id === 'slLogoY') document.getElementById('valLogoY').innerText = e.target.value;
                if (currentImage) prepareAndRender();
            });
        });

        document.getElementById('inLayout').addEventListener('change', () => {
            dragOffsets = { brand: {x: 0, y: 0}, specs: {x: 0, y: 0}, loc: {x: 0, y: 0} };
            if (currentImage) prepareAndRender();
        });
        
        document.getElementById('btnResetDrag').addEventListener('click', () => {
            dragOffsets = { brand: {x: 0, y: 0}, specs: {x: 0, y: 0}, loc: {x: 0, y: 0} };
            if (currentImage) prepareAndRender();
        });

        async function prepareAndRender() {
            let makeTxt = document.getElementById('inMake').value.trim().toUpperCase();
            const brand = BRAND_MAP[makeTxt];
            const colorMode = document.getElementById('inColor').value;
            currentCacheKey = `${makeTxt}_${colorMode}`;
            
            if (brand && !loadedImages[currentCacheKey]) {
                try {
                    const res = await fetch(`https://cdn.jsdelivr.net/npm/simple-icons@v12/icons/${brand.slug}.svg`);
                    let svgText = await res.text();
                    
                    let hex = "#ffffff"; 
                    if (colorMode === 'black') hex = "#000000";
                    if (colorMode === 'original') hex = brand.color;
                    
                    const styleInject = `<style>path{fill:${hex} !important;} polygon{fill:${hex} !important;}</style></svg>`;
                    svgText = svgText.replace('</svg>', styleInject);
                    
                    const blob = new Blob([svgText], {type: 'image/svg+xml;charset=utf-8'});
                    const url = URL.createObjectURL(blob);
                    
                    const img = new Image();
                    await new Promise((resolve) => { img.onload = resolve; img.src = url; });
                    loadedImages[currentCacheKey] = img;
                } catch (e) { console.error("Lỗi kéo logo: ", e); }
            }
            drawCanvasSync(currentCacheKey);
        }

        async function getFullCityName(lat, lon) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=16&addressdetails=1&accept-language=vi`;
                const res = await fetch(url);
                const data = await res.json();
                if (!data || !data.address) throw new Error("OSM Empty");
                
                const ad = data.address;
                const level1 = ad.road || ad.neighbourhood || ad.hamlet || "";
                const level2 = ad.quarter || ad.suburb || ad.village || ad.town || "";
                const level3 = ad.city_district || ad.county || ad.district || "";
                const level4 = ad.city || ad.state || ad.province || "";
                
                const parts = [level1, level2, level3, level4].filter(Boolean);
                const uniqueParts = [...new Set(parts)];
                return uniqueParts.join(', ');
            } catch (error) { 
                try {
                    const backupUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=vi`;
                    const res2 = await fetch(backupUrl);
                    const data2 = await res2.json();
                    const parts = [data2.locality, data2.city, data2.principalSubdivision].filter(Boolean);
                    return [...new Set(parts)].join(', ');
                } catch (err2) { return ""; }
            }
        }

        document.getElementById('imageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('status');
            statusEl.innerText = "Đang rà soát Metadata...";
            statusEl.style.color = "#ffeb3b";
            document.getElementById('downloadBtn').style.display = 'none';

            let make = "", model = "", specs = "", loc = "", dateStr = "";
            let lat = null, lon = null;

            try {
                const imgExif = await exifr.parse(file, true); 

                if (imgExif) {
                    if (imgExif.Make) make = imgExif.Make.toUpperCase();
                    if (imgExif.Model) model = imgExif.Model.toUpperCase();
                    
                    const focal = imgExif.FocalLengthIn35mmFormat ? `${imgExif.FocalLengthIn35mmFormat}mm` : (imgExif.FocalLength ? `${Math.round(imgExif.FocalLength)}mm` : "");
                    const fstop = imgExif.FNumber ? `f/${imgExif.FNumber}` : "";
                    const exposure = imgExif.ExposureTime ? (imgExif.ExposureTime < 1 ? `1/${Math.round(1/imgExif.ExposureTime)}` : `${imgExif.ExposureTime}s`) : "";
                    const iso = imgExif.ISO ? `ISO${imgExif.ISO}` : "";
                    specs = [focal, fstop, exposure, iso].filter(Boolean).join(" ");

                    if(imgExif.DateTimeOriginal) {
                        const d = new Date(imgExif.DateTimeOriginal);
                        dateStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
                    }
                    
                    if (imgExif.latitude != null && imgExif.longitude != null) {
                        lat = imgExif.latitude; lon = imgExif.longitude;
                        const fullAddress = await getFullCityName(lat, lon);
                        if (fullAddress) {
                            loc = `${fullAddress} | ${dateStr}`;
                            statusEl.innerHTML = "Trích xuất hoàn tất toàn bộ thông số và địa điểm!";
                            statusEl.style.color = "#4caf50";
                        } else {
                            loc = dateStr;
                            statusEl.innerHTML = "⚠ Đã có tọa độ nhưng quá trình dịch bản đồ bị lỗi mạng. Hãy gõ tay địa điểm.";
                            statusEl.style.color = "#ff9800";
                        }
                    } else {
                        loc = dateStr;
                        statusEl.innerHTML = `⚠ File bị trống tọa độ GPS. Không thể định vị tự động.`;
                        statusEl.style.color = "#ff9800";
                    }
                } else {
                    statusEl.innerText = "Ảnh trắng toàn bộ EXIF, vui lòng gõ tay.";
                    statusEl.style.color = "#ff9800";
                }
            } catch (err) { statusEl.innerText = "Lỗi: File lỗi cấu trúc hoặc không hỗ trợ."; }

            let finalModel = model.replace(make, "").trim();
            if (make === 'APPLE' && finalModel.includes('IPHONE')) finalModel = finalModel; 
            
            document.getElementById('inMake').value = make || "SAMSUNG"; 
            document.getElementById('inModel').value = finalModel || "GALAXY"; 
            document.getElementById('inSpecs').value = specs;
            document.getElementById('inLocation').value = loc;
            
            dragOffsets = { brand: {x: 0, y: 0}, specs: {x: 0, y: 0}, loc: {x: 0, y: 0} };

            let fileToLoad = file;
            if (file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif')) {
                try {
                    const blobResult = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.95 });
                    fileToLoad = Array.isArray(blobResult) ? blobResult[0] : blobResult;
                } catch (err) { statusEl.innerText = "Lỗi giải mã file HEIC!"; return; }
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    document.getElementById('downloadBtn').style.display = 'block';
                    prepareAndRender();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(fileToLoad);
        });

        function drawCanvasSync(cacheKey) {
            const canvas = document.getElementById('outCanvas');
            const ctx = canvas.getContext('2d');

            const blur = parseInt(document.getElementById('slBlur').value);
            const padding = Math.floor(currentImage.width * (parseInt(document.getElementById('slPadding').value) / 100)); 
            const bottomPadding = Math.floor(currentImage.width * (parseInt(document.getElementById('slBottom').value) / 100)); 
            
            const cornerRadius = Math.floor(currentImage.width * 0.02);
            const scale = parseInt(document.getElementById('slScale').value) / 100;
            const offset = (parseInt(document.getElementById('slOffsetY').value) / 100) * padding;
            // Tỷ lệ bù trừ từ thanh Căn chỉnh Logo
            const logoYAdjust = (parseInt(document.getElementById('slLogoY').value) / 100) * (canvas.width * 0.012 * scale);
            
            const makeTxt = document.getElementById('inMake').value.trim().toUpperCase();
            let modelTxt = document.getElementById('inModel').value.trim();
            const layout = document.getElementById('inLayout').value;
            const colorMode = document.getElementById('inColor').value; 
            const brand = BRAND_MAP[makeTxt];

            canvas.width = currentImage.width + (padding * 2);
            canvas.height = currentImage.height + padding + bottomPadding;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.filter = `blur(${blur}px) brightness(0.6)`;
            ctx.drawImage(currentImage, -padding, -padding, canvas.width + padding*2, canvas.height + padding*2);
            ctx.restore();

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(padding, padding, currentImage.width, currentImage.height, cornerRadius);
            ctx.clip();
            ctx.drawImage(currentImage, padding, padding, currentImage.width, currentImage.height);
            ctx.restore();

            const baseFont = canvas.width * 0.012 * scale;
            let mainY = padding + currentImage.height + (bottomPadding / 2) + offset; 
            
            const mainColor = colorMode === 'black' ? "#000000" : "#ffffff";
            const subColor = colorMode === 'black' ? "rgba(0,0,0,0.7)" : "rgba(255,255,255,0.7)";

            const logoImg = loadedImages[cacheKey];
            let logoDrawS = 0, visualW = 0, paddingAfterLogo = 0, yTweak = 0;
            
            if (logoImg && brand) {
                logoDrawS = baseFont * brand.scale; 
                visualW = logoDrawS; 
                paddingAfterLogo = brand.type === 'wordmark' ? baseFont * 0.2 : baseFont * 0.5;
                // Cộng thêm tùy chỉnh của User
                yTweak = (brand.yOffset * baseFont) + logoYAdjust; 
            } else if (makeTxt) {
                ctx.font = `900 ${baseFont * 1.5}px 'Arial Black', Impact, sans-serif`;
                visualW = ctx.measureText(makeTxt).width;
                paddingAfterLogo = baseFont * 0.4;
                yTweak = (-0.05 * baseFont) + logoYAdjust;
            }

            ctx.font = `normal ${baseFont}px 'Segoe UI', Arial, sans-serif`;
            modelTxt = modelTxt.toUpperCase(); 
            let modelWidth = ctx.measureText(modelTxt ? modelTxt : "").width;
            let totalBrandWidth = visualW + (modelTxt ? paddingAfterLogo : 0) + modelWidth;

            let brandBaseX = (layout === 'center') ? (canvas.width / 2) - (totalBrandWidth / 2) : padding + (canvas.width * 0.02);
            let brandBaseY = mainY - (layout === 'center' ? baseFont * 1.2 : 0); 
            
            let brandX = brandBaseX + dragOffsets.brand.x;
            let brandY = brandBaseY + dragOffsets.brand.y;

            // DRAW LOGO với yTweak hoàn hảo
            if (logoImg) {
                ctx.drawImage(logoImg, brandX, brandY - logoDrawS/2 + yTweak, logoDrawS, logoDrawS);
            } else if (makeTxt) {
                ctx.fillStyle = mainColor; ctx.textAlign = 'left'; ctx.textBaseline = "middle";
                ctx.font = `900 ${baseFont * 1.5}px 'Arial Black', Impact, sans-serif`;
                ctx.fillText(makeTxt, brandX, brandY + yTweak);
            }
            if(modelTxt) {
                ctx.fillStyle = mainColor; ctx.textAlign = 'left'; ctx.textBaseline = "middle";
                ctx.font = `normal ${baseFont}px 'Segoe UI', Arial, sans-serif`;
                ctx.fillText(modelTxt, brandX + visualW + paddingAfterLogo, brandY);
            }

            const brandHitH = Math.max(logoDrawS, baseFont * 1.5) + baseFont;
            hitBoxes.brand = { x: brandX - baseFont/2, y: brandY - brandHitH/2, w: totalBrandWidth + baseFont, h: brandHitH };


            ctx.fillStyle = subColor;
            ctx.font = `normal ${baseFont * 0.8}px 'Segoe UI', Arial, sans-serif`;
            const specs = document.getElementById('inSpecs').value.trim();
            const loc = document.getElementById('inLocation').value.trim();

            let specsBaseX, specsBaseY, specsAlign;
            let locBaseX, locBaseY, locAlign;

            if (layout === 'center') {
                specsBaseX = canvas.width / 2; specsBaseY = mainY + baseFont * 0.3; specsAlign = 'center';
                locBaseX = canvas.width / 2; locBaseY = specsBaseY + baseFont * 1.2; locAlign = 'center';
            } else {
                specsBaseX = canvas.width - padding - (canvas.width * 0.02); specsBaseY = mainY - baseFont*0.6; specsAlign = 'right';
                locBaseX = canvas.width - padding - (canvas.width * 0.02); locBaseY = mainY + baseFont*0.6; locAlign = 'right';
            }

            if (specs) {
                let sX = specsBaseX + dragOffsets.specs.x; let sY = specsBaseY + dragOffsets.specs.y;
                ctx.textAlign = specsAlign; ctx.textBaseline = "middle";
                ctx.fillText(specs, sX, sY);
                
                let sw = ctx.measureText(specs).width;
                let hsX = (specsAlign === 'center') ? sX - sw/2 : (specsAlign === 'right' ? sX - sw : sX);
                hitBoxes.specs = { x: hsX - baseFont/2, y: sY - baseFont, w: sw + baseFont, h: baseFont * 2 };
            } else { hitBoxes.specs = {x:0, y:0, w:0, h:0}; }

            if (loc) {
                if(!specs && layout === 'split') { locBaseY = mainY; }
                
                let lX = locBaseX + dragOffsets.loc.x; let lY = locBaseY + dragOffsets.loc.y;
                ctx.textAlign = locAlign; ctx.textBaseline = "middle";
                ctx.fillText(loc, lX, lY);
                
                let lw = ctx.measureText(loc).width;
                let hlX = (locAlign === 'center') ? lX - lw/2 : (locAlign === 'right' ? lX - lw : lX);
                hitBoxes.loc = { x: hlX - baseFont/2, y: lY - baseFont, w: lw + baseFont, h: baseFont * 2 };
            } else { hitBoxes.loc = {x:0, y:0, w:0, h:0}; }
        }

        const canvas = document.getElementById('outCanvas');

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            if(evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function handleStart(e) {
            if(!currentImage) return;
            const pos = getMousePos(e);
            for (let key of ['loc', 'specs', 'brand']) {
                let box = hitBoxes[key];
                if (pos.x >= box.x && pos.x <= box.x + box.w && pos.y >= box.y && pos.y <= box.y + box.h) {
                    activeDrag = key;
                    startMouseX = pos.x;
                    startMouseY = pos.y;
                    if(e.type === 'touchstart') e.preventDefault(); 
                    break;
                }
            }
        }

        function handleMove(e) {
            if (!activeDrag) return;
            if(e.type === 'touchmove') e.preventDefault();
            const pos = getMousePos(e);
            const dx = pos.x - startMouseX;
            const dy = pos.y - startMouseY;
            dragOffsets[activeDrag].x += dx;
            dragOffsets[activeDrag].y += dy;
            startMouseX = pos.x;
            startMouseY = pos.y;
            requestAnimationFrame(() => drawCanvasSync(currentCacheKey));
        }

        function handleEnd(e) { activeDrag = null; }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `Pro_Watermark_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });
    </script>
</body>
</html>
