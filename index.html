<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Watermark Generator (Ultimate Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #2979ff; --text: #f5f5f5; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; flex-direction: row; gap: 20px; width: 100%; max-width: 1200px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
        .control-panel { background: var(--panel); padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .canvas-wrapper { flex: 1; min-width: 300px; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        canvas { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #aaa; text-transform: uppercase; }
        input[type="text"], input[type="file"], select { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: var(--accent); }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        .slider-label { display: flex; justify-content: space-between; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background: #1c54b2; }
        #status { color: #ffeb3b; font-size: 13px; margin-bottom: 15px; font-weight: 600; text-align: center; line-height: 1.4;}
        .section-title { margin: 0 0 15px 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bảng Điều Khiển -->
        <div class="control-panel">
            <h2 class="section-title">Nạp Ảnh & Thông Số</h2>
            
            <div class="form-group">
                <input type="file" id="imageInput" accept="image/jpeg, image/png, image/heic, image/heif, .heic, .heif">
            </div>
            <div id="status">Chờ nạp ảnh...</div>

            <div class="form-group">
                <label>Hãng (Gõ Samsung, Xiaomi, Leica, Huawei...)</label>
                <input type="text" id="inMake" placeholder="VD: SAMSUNG">
            </div>
            <div class="form-group">
                <label>Tên Thiết Bị</label>
                <input type="text" id="inModel" placeholder="VD: GALAXY S24 ULTRA">
            </div>
            <div class="form-group">
                <label>Thông số EXIF</label>
                <input type="text" id="inSpecs" placeholder="VD: 23mm f/1.7 1/1350 ISO12">
            </div>
            <div class="form-group">
                <label>Địa điểm & Thời gian</label>
                <input type="text" id="inLocation" placeholder="VD: Phường, Quận, Thành phố | Ngày">
            </div>

            <h2 class="section-title" style="margin-top: 25px;">Tùy Chỉnh Giao Diện</h2>
            <div class="form-group">
                <label>Bố cục Chữ (Layout)</label>
                <select id="inLayout">
                    <option value="center">Căn Giữa (Nằm dưới đáy)</option>
                    <option value="split">Chia Trái - Phải</option>
                </select>
            </div>
            <div class="form-group">
                <label>Màu Logo & Chữ</label>
                <select id="inColor">
                    <option value="original">Màu Hãng (Xanh Samsung, Đỏ Leica...)</option>
                    <option value="white">Trắng (White)</option>
                    <option value="black">Đen (Black)</option>
                </select>
            </div>
            <div class="form-group">
                <div class="slider-label"><label>Độ Mờ Nền (Blur)</label><span id="valBlur">16</span></div>
                <input type="range" id="slBlur" min="0" max="100" value="16">
            </div>
            <div class="form-group">
                <div class="slider-label"><label>Độ Dày Viền (%)</label><span id="valPadding">6</span></div>
                <input type="range" id="slPadding" min="2" max="25" value="6">
            </div>
            <div class="form-group">
                <div class="slider-label"><label>Kích Thước Chữ (Scale)</label><span id="valScale">185</span></div>
                <input type="range" id="slScale" min="50" max="300" value="185">
            </div>
            <div class="form-group">
                <div class="slider-label"><label>Di Chuyển Lên/Xuống</label><span id="valOffsetY">0</span></div>
                <input type="range" id="slOffsetY" min="-100" max="100" value="0">
            </div>

            <button class="btn" id="downloadBtn" style="display:none;">Tải Ảnh Về</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="outCanvas"></canvas>
        </div>
    </div>

    <script>
        let currentImage = null;
        const loadedImages = {}; 

        // 17 Hãng Lớn (Scale đã được tinh chỉnh lại cho hài hòa)
        const BRAND_MAP = {
            'SAMSUNG': { slug: 'samsung', color: '#1428A0', type: 'wordmark', scale: 4.5 },
            'APPLE': { slug: 'apple', color: '#000000', type: 'icon', scale: 1.3 },
            'XIAOMI': { slug: 'xiaomi', color: '#FF6900', type: 'icon', scale: 1.5 },
            'SONY': { slug: 'sony', color: '#000000', type: 'wordmark', scale: 4.5 },
            'OPPO': { slug: 'oppo', color: '#006633', type: 'wordmark', scale: 3.5 },
            'VIVO': { slug: 'vivo', color: '#415FFF', type: 'wordmark', scale: 3.5 },
            'HUAWEI': { slug: 'huawei', color: '#FF0000', type: 'icon', scale: 1.6 },
            'ONEPLUS': { slug: 'oneplus', color: '#F5010C', type: 'icon', scale: 1.5 },
            'GOOGLE': { slug: 'google', color: '#4285F4', type: 'icon', scale: 1.5 },
            'ASUS': { slug: 'asus', color: '#00539B', type: 'wordmark', scale: 4 },
            'REALME': { slug: 'realme', color: '#FFD600', type: 'wordmark', scale: 4 },
            'MOTOROLA': { slug: 'motorola', color: '#001428', type: 'icon', scale: 1.5 },
            'NOKIA': { slug: 'nokia', color: '#124191', type: 'wordmark', scale: 4.5 },
            'CANON': { slug: 'canon', color: '#CC0000', type: 'wordmark', scale: 4.5 },
            'NIKON': { slug: 'nikon', color: '#FFE600', type: 'wordmark', scale: 4.5 },
            'FUJIFILM': { slug: 'fujifilm', color: '#EE0000', type: 'wordmark', scale: 4.5 },
            'LEICA': { slug: 'leica', color: '#ED1C24', type: 'icon', scale: 1.8 }
        };

        // Bắt sự kiện Real-time
        ['inMake', 'inModel', 'inSpecs', 'inLocation', 'inLayout', 'inColor', 'slBlur', 'slPadding', 'slScale', 'slOffsetY'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                if(e.target.id === 'slBlur') document.getElementById('valBlur').innerText = e.target.value;
                if(e.target.id === 'slPadding') document.getElementById('valPadding').innerText = e.target.value;
                if(e.target.id === 'slScale') document.getElementById('valScale').innerText = e.target.value;
                if(e.target.id === 'slOffsetY') document.getElementById('valOffsetY').innerText = e.target.value;
                if (currentImage) prepareAndRender();
            });
        });

        // Bơm CSS ép màu Logo SVG
        async function prepareAndRender() {
            let makeTxt = document.getElementById('inMake').value.trim().toUpperCase();
            const brand = BRAND_MAP[makeTxt];
            const colorMode = document.getElementById('inColor').value;
            const cacheKey = `${makeTxt}_${colorMode}`;
            
            if (brand && !loadedImages[cacheKey]) {
                try {
                    const res = await fetch(`https://cdn.jsdelivr.net/npm/simple-icons@v12/icons/${brand.slug}.svg`);
                    let svgText = await res.text();
                    
                    let hex = "#ffffff"; 
                    if (colorMode === 'black') hex = "#000000";
                    if (colorMode === 'original') hex = brand.color;
                    
                    const styleInject = `<style>path{fill:${hex} !important;} polygon{fill:${hex} !important;}</style></svg>`;
                    svgText = svgText.replace('</svg>', styleInject);
                    
                    const blob = new Blob([svgText], {type: 'image/svg+xml;charset=utf-8'});
                    const url = URL.createObjectURL(blob);
                    
                    const img = new Image();
                    await new Promise((resolve) => { img.onload = resolve; img.src = url; });
                    loadedImages[cacheKey] = img;
                } catch (e) { console.error("Lỗi kéo logo: ", e); }
            }
            drawCanvasSync(cacheKey);
        }

        // Lấy chi tiết toàn bộ địa chỉ (Xã, Phường, Quận, Huyện)
        async function getFullCityName(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=16&addressdetails=1`, {
                    headers: { 'Accept-Language': 'vi,en-US;q=0.9' }
                });
                const data = await res.json();
                if (!data || !data.address) return "";
                
                const ad = data.address;
                const level1 = ad.road || ad.neighbourhood || ad.hamlet || "";
                const level2 = ad.quarter || ad.suburb || ad.village || ad.town || "";
                const level3 = ad.city_district || ad.county || ad.district || "";
                const level4 = ad.city || ad.state || ad.province || "";
                
                // Lọc bỏ những cấp độ rỗng và trùng lặp
                const parts = [level1, level2, level3, level4].filter(Boolean);
                const uniqueParts = [...new Set(parts)];
                
                return uniqueParts.join(', ');
            } catch (error) { 
                console.error("Lỗi định vị:", error);
                return ""; 
            }
        }

        // Xử lý File Ảnh & EXIF
        document.getElementById('imageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('status');
            statusEl.innerText = "Đang phân tích dữ liệu ảnh...";
            statusEl.style.color = "#ffeb3b";
            document.getElementById('downloadBtn').style.display = 'none';

            let make = "", model = "", specs = "", loc = "", dateStr = "";
            let lat = null, lon = null;

            try {
                // Đọc EXIF tổng quát
                const imgExif = await exifr.parse(file, {gps: true, exif: true});
                // Đọc ép chuyên sâu GPS (Đặc trị cho HEIC)
                const gpsData = await exifr.gps(file).catch(() => null);

                if (imgExif) {
                    if (imgExif.Make) make = imgExif.Make.toUpperCase();
                    if (imgExif.Model) model = imgExif.Model.toUpperCase();
                    
                    const focal = imgExif.FocalLengthIn35mmFormat ? `${imgExif.FocalLengthIn35mmFormat}mm` : (imgExif.FocalLength ? `${Math.round(imgExif.FocalLength)}mm` : "");
                    const fstop = imgExif.FNumber ? `f/${imgExif.FNumber}` : "";
                    const exposure = imgExif.ExposureTime ? (imgExif.ExposureTime < 1 ? `1/${Math.round(1/imgExif.ExposureTime)}` : `${imgExif.ExposureTime}s`) : "";
                    const iso = imgExif.ISO ? `ISO${imgExif.ISO}` : "";
                    specs = [focal, fstop, exposure, iso].filter(Boolean).join(" ");

                    if(imgExif.DateTimeOriginal) {
                        const d = new Date(imgExif.DateTimeOriginal);
                        dateStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
                    }
                    
                    // Lấy Tọa độ cẩn thận
                    lat = gpsData ? gpsData.latitude : (imgExif.latitude || null);
                    lon = gpsData ? gpsData.longitude : (imgExif.longitude || null);
                    
                    let statusMsg = "Trích xuất thông số thành công!";
                    if (lat != null && lon != null) {
                        const fullAddress = await getFullCityName(lat, lon);
                        loc = fullAddress ? `${fullAddress} | ${dateStr}` : dateStr;
                    } else {
                        loc = dateStr;
                        statusMsg += "<br><span style='color:#ff9800'>(Lưu ý: Ảnh này không chứa tọa độ GPS do lúc chụp tắt định vị hoặc đã bị xóa)</span>";
                    }
                    
                    statusEl.innerHTML = statusMsg;
                    statusEl.style.color = "#4caf50";
                } else {
                    statusEl.innerText = "Ảnh không có EXIF, vui lòng gõ tay thông số.";
                    statusEl.style.color = "#ff9800";
                }
            } catch (err) { statusEl.innerText = "Lỗi: Không đọc được siêu dữ liệu của file này."; }

            let finalModel = model.replace(make, "").trim();
            if (make === 'APPLE' && finalModel.includes('IPHONE')) finalModel = finalModel; 
            
            document.getElementById('inMake').value = make || "SAMSUNG"; 
            document.getElementById('inModel').value = finalModel || "GALAXY"; 
            document.getElementById('inSpecs').value = specs;
            document.getElementById('inLocation').value = loc;

            let fileToLoad = file;
            if (file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif')) {
                try {
                    const blobResult = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.95 });
                    fileToLoad = Array.isArray(blobResult) ? blobResult[0] : blobResult;
                } catch (err) { statusEl.innerText = "Lỗi giải mã file HEIC!"; return; }
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    document.getElementById('downloadBtn').style.display = 'block';
                    prepareAndRender();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(fileToLoad);
        });

        // Lõi vẽ đồ họa
        function drawCanvasSync(cacheKey) {
            const canvas = document.getElementById('outCanvas');
            const ctx = canvas.getContext('2d');

            const blur = parseInt(document.getElementById('slBlur').value);
            const padding = Math.floor(currentImage.width * (parseInt(document.getElementById('slPadding').value) / 100)); 
            const cornerRadius = Math.floor(currentImage.width * 0.02);
            const scale = parseInt(document.getElementById('slScale').value) / 100;
            const offset = (parseInt(document.getElementById('slOffsetY').value) / 100) * padding;
            
            const makeTxt = document.getElementById('inMake').value.trim().toUpperCase();
            let modelTxt = document.getElementById('inModel').value.trim();
            const layout = document.getElementById('inLayout').value;
            const colorMode = document.getElementById('inColor').value; 
            const brand = BRAND_MAP[makeTxt];

            const bottomSpace = padding * 1.5; 
            canvas.width = currentImage.width + (padding * 2);
            canvas.height = currentImage.height + padding + bottomSpace;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Xóa phông mờ
            ctx.save();
            ctx.filter = `blur(${blur}px) brightness(0.6)`;
            ctx.drawImage(currentImage, -padding, -padding, canvas.width + padding*2, canvas.height + padding*2);
            ctx.restore();

            // Ảnh chính
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(padding, padding, currentImage.width, currentImage.height, cornerRadius);
            ctx.clip();
            ctx.drawImage(currentImage, padding, padding, currentImage.width, currentImage.height);
            ctx.restore();

            const baseFont = canvas.width * 0.012 * scale;
            let mainY = padding + currentImage.height + (bottomSpace / 2) + offset;
            
            const mainColor = colorMode === 'black' ? "#000000" : "#ffffff";
            const subColor = colorMode === 'black' ? "rgba(0,0,0,0.7)" : "rgba(255,255,255,0.7)";

            const logoImg = loadedImages[cacheKey];
            let logoDrawS = 0, visualW = 0, paddingAfterLogo = 0;
            
            if (logoImg && brand) {
                logoDrawS = baseFont * brand.scale;
                visualW = logoDrawS; 
                paddingAfterLogo = brand.type === 'wordmark' ? baseFont * 0.2 : baseFont * 0.5;
            } else if (makeTxt) {
                ctx.font = `900 ${baseFont * 1.5}px 'Arial Black', Impact, sans-serif`;
                visualW = ctx.measureText(makeTxt).width;
                paddingAfterLogo = baseFont * 0.4;
            }

            ctx.font = `normal ${baseFont}px 'Segoe UI', Arial, sans-serif`;
            modelTxt = modelTxt.toUpperCase(); 
            let modelWidth = ctx.measureText(modelTxt ? modelTxt : "").width;
            let totalWidth = visualW + (modelTxt ? paddingAfterLogo : 0) + modelWidth;

            let startX = (layout === 'center') ? (canvas.width / 2) - (totalWidth / 2) : padding + (canvas.width * 0.02);

            // VẼ LOGO / HÃNG
            if (logoImg) {
                ctx.drawImage(logoImg, startX, mainY - logoDrawS/2, logoDrawS, logoDrawS);
            } else if (makeTxt) {
                ctx.fillStyle = mainColor; ctx.textAlign = 'left'; ctx.textBaseline = "middle";
                ctx.font = `900 ${baseFont * 1.5}px 'Arial Black', Impact, sans-serif`;
                ctx.fillText(makeTxt, startX, mainY);
            }

            // VẼ TÊN MÁY
            if(modelTxt) {
                ctx.fillStyle = mainColor; ctx.textAlign = 'left'; ctx.textBaseline = "middle";
                ctx.font = `normal ${baseFont}px 'Segoe UI', Arial, sans-serif`;
                ctx.fillText(modelTxt, startX + visualW + paddingAfterLogo, mainY);
            }

            // VẼ THÔNG SỐ EXIF & GPS
            ctx.fillStyle = subColor;
            ctx.font = `normal ${baseFont * 0.8}px 'Segoe UI', Arial, sans-serif`;
            const specs = document.getElementById('inSpecs').value.trim();
            const loc = document.getElementById('inLocation').value.trim();

            if (layout === 'center') {
                ctx.textAlign = "center";
                let subY = mainY + baseFont;
                if(specs) { ctx.fillText(specs, canvas.width / 2, subY); subY += baseFont * 1.2; }
                if(loc) ctx.fillText(loc, canvas.width / 2, subY);
            } else {
                ctx.textAlign = "right";
                let rightX = canvas.width - padding - (canvas.width * 0.02);
                if(specs && loc) {
                    ctx.fillText(specs, rightX, mainY - baseFont*0.6); ctx.fillText(loc, rightX, mainY + baseFont*0.6);
                } else if (specs || loc) {
                    ctx.fillText(specs || loc, rightX, mainY);
                }
            }
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `Pro_Watermark_${Date.now()}.jpg`;
            link.href = document.getElementById('outCanvas').toDataURL('image/jpeg', 0.95);
            link.click();
        });
    </script>
</body>
</html>
